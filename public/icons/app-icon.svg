<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21463a"/>
      <stop offset=".52" stop-color="#527e59"/>
      <stop offset="1" stop-color="#18392f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".2" r=".8">
      <stop stop-color="#d5efb4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#d5efb4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1=".15" y1=".05" x2=".85" y2=".95">
